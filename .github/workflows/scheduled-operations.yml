name: Scheduled operations
# Free hosting has no always-on worker. Every 15 minutes this calls the token-protected endpoint that runs one bounded,
# idempotent batch of deadline jobs and outbox deliveries. Without the secret it does nothing.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scheduled-operations
  cancel-in-progress: false
jobs:
  run:
    if: github.repository == 'Galinsky-2028/Debate-Engine'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run one bounded batch of deadline jobs and deliveries
        env:
          OPERATIONS_RUN_TOKEN: ${{ secrets.OPERATIONS_RUN_TOKEN }}
          PDE_URL: https://public-debate-engine.onrender.com
        run: |
          if [ -z "$OPERATIONS_RUN_TOKEN" ]; then echo "OPERATIONS_RUN_TOKEN is not configured; nothing to run."; exit 0; fi
          # The free web service may be asleep; allow time for a cold start and retry once.
          for attempt in 1 2; do
            status=$(curl -sS -o /tmp/result.json -w '%{http_code}' --max-time 120 -X POST \
              -H "Authorization: Bearer $OPERATIONS_RUN_TOKEN" "$PDE_URL/api/operations/scheduled-run" || echo 000)
            if [ "$status" = "200" ]; then cat /tmp/result.json; echo; exit 0; fi
            echo "Attempt $attempt returned HTTP $status"; sleep 30
          done
          exit 1
