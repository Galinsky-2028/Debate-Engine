name: Live deployment smoke
on:
  # No schedule (owner decision 2026-11-14). Runs after a push to main, or by hand.
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  live-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Render deploys from main are started manually, so a push run checks the release that is live at that moment.
      PDE_PREVIEW_URL: https://public-debate-engine.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only check of the live deployment; unauthorized mutations must be refused
        run: node scripts/smoke-preview.mjs
