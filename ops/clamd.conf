# The scanner has its own Unix identity; no unauthenticated TCP listener.
Foreground yes
User clamav
LocalSocket /run/clamav/clamd.ctl
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
OfficialDatabaseOnly yes
ConcurrentDatabaseReload no
StreamMaxLength 65M
MaxFileSize 65M
MaxScanSize 130M
MaxScanTime 60000
MaxThreads 1
MaxQueue 2
ReadTimeout 120
CommandReadTimeout 30
AlertExceedsMax yes
LogTime yes
LogSyslog no
